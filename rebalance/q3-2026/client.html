document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

===== -->\n  <div style=\"background: #FAF7F2; border-bottom: 1px solid #E4DDcc;\">\n    <div style=\"max-width: 820px; margin: 0 auto; padding: 26px 24px;\">\n      <div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #C9A84C; margin-bottom: 16px;\">Every Trade This Quarter<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px;\">\n        <div>\n          <div style=\"font-family: Georgia, serif; font-size: 15px; color: #171738; margin-bottom: 8px;\">Dividend Portfolio<\u002Fdiv>\n          <div style=\"font-size: 13.5px; line-height: 1.6;\"><span style=\"color: #A8332F; font-weight: 600;\">OUT<\u002Fspan> &nbsp;Valero · Devon · Black Hills<br><span style=\"color: #4A7C59; font-weight: 600;\">IN<\u002Fspan> &nbsp;&nbsp;&nbsp;Constellation · S&amp;P Global · NatWest<br><span style=\"color: #8B7355;\">Trims — AMD · Caterpillar · Lam Research<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: Georgia, serif; font-size: 15px; color: #171738; margin-bottom: 8px;\">Growth Portfolio<\u002Fdiv>\n          <div style=\"font-size: 13.5px; line-height: 1.6;\"><span style=\"color: #A8332F; font-weight: 600;\">OUT<\u002Fspan> &nbsp;Coinbase · Grupo Supervielle · Clearwater<br><span style=\"color: #4A7C59; font-weight: 600;\">IN<\u002Fspan> &nbsp;&nbsp;&nbsp;ServiceNow · SoFi · Full Truck Alliance<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 18px; padding-top: 16px; border-top: 1px solid #E4DDcc; font-size: 12.5px; color: #8B7355;\">Both equity portfolios remain at 25 holdings each. <span style=\"color: rgb(23, 23, 56);\">Five-year cash strategy:<\u002Fspan> added Invesco BulletShares 2030 Corporate Bond ETF (BSCU) as our new 5th year bond.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ SECTION 1 — OVERVIEW ============ -->\n  <section id=\"s1\" data-screen-label=\"1 · Overview\" style=\"max-width: 820px; margin: 0 auto; padding: 58px 24px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; cursor: pointer;\" data-target=\"s1body\" sc-camel-on-click=\"{{ toggleSection }}\">\n      <span style=\"font-family: Georgia, serif; font-size: 15px; color: #C9A84C; font-style: italic;\">01<\u002Fspan>\n      <h2 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 32px; margin: 0; color: #171738; flex: 1;\">What Changed &amp; Why<\u002Fh2>\n      <span data-chev=\"\" style=\"color: #C9A84C; font-size: 15px; transition: transform 0.2s; user-select: none;\">▾<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"s1body\" style=\"margin-top: 22px;\">\n      <p style=\"font-size: 17px; line-height: 1.75; margin: 0;\">This quarter's changes were driven by three forces: the Iran conflict and its round-trip through the oil market, a sharp repricing of high-quality software and data companies, and the accelerating electricity demand behind the AI build-out.<\u002Fp>\n      <p style=\"font-size: 17px; line-height: 1.75; margin: 18px 0 0;\">We realigned both portfolios — trimming what had run ahead of its fundamentals and adding durable businesses trading at unusual discounts. Every change was informed by our research library and sector-rotation framework.<\u002Fp>\n    <\u002Fdiv>\n      <div style=\"max-width:820px; margin:10px auto 0; padding:0 24px;\"><div style=\"border-top:1px solid #E4DDcc; padding-top:10px; font-size:10.5px; letter-spacing:0.04em; color:#A79E8C; font-style:italic; font-family:Georgia,serif;\">Paradiem, LLC is a registered investment advisor.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SECTION 2 — MARKET CONTEXT ============ -->\n  <section id=\"s2\" data-screen-label=\"2 · Market Context\" style=\"background: #FAF7F2; border-top: 1px solid #E4DDcc; border-bottom: 1px solid #E4DDcc; margin-top: 40px;\">\n    <div style=\"max-width: 820px; margin: 0 auto; padding: 56px 24px 24px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; cursor: pointer;\" data-target=\"s2body\" sc-camel-on-click=\"{{ toggleSection }}\">\n        <span style=\"font-family: Georgia, serif; font-size: 15px; color: #C9A84C; font-style: italic;\">02<\u002Fspan>\n        <h2 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 32px; margin: 0; color: #171738; flex: 1;\">Market Context<\u002Fh2>\n        <span data-chev=\"\" style=\"color: #C9A84C; font-size: 15px; user-select: none;\">▾<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"s2body\" style=\"margin-top: 30px; display: grid; gap: 30px;\">\n\n        <div style=\"border-left: 3px solid #C9A84C; padding-left: 22px;\">\n          <div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #8B7355; margin-bottom: 8px;\">Geopolitical Disruption<\u002Fdiv>\n          <h3 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 21px; margin: 0 0 10px; color: #171738;\">The Oil Round-Trip<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.72; margin: 0;\">The Iran conflict pushed crude above $100 per barrel when the Strait of Hormuz — roughly 20% of the world's seaborne oil — was disrupted in the spring. Since the June ceasefire, oil has round-tripped nearly all the way back to about $70. The premium came out of crude, but the situation remains fragile: the strait is only partly reopened, and refining margins stayed elevated well after crude normalized.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border-left: 3px solid #C9A84C; padding-left: 22px;\">\n          <div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #8B7355; margin-bottom: 8px;\">A Mispricing<\u002Fdiv>\n          <h3 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 21px; margin: 0 0 10px; color: #171738;\">The Software &amp; Data Repricing<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.72; margin: 0;\">Markets spent much of the quarter worried that AI would disrupt established software and data companies, and sold many of them down to some of the cheapest valuations in their history. We view this as a mispricing for some companies — the strongest of these businesses are selling AI tools and getting stronger, not weaker.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border-left: 3px solid #C9A84C; padding-left: 22px;\">\n          <div style=\"font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #8B7355; margin-bottom: 8px;\">The Real Constraint<\u002Fdiv>\n          <h3 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 21px; margin: 0 0 10px; color: #171738;\">The Electricity Bottleneck<\u002Fh3>\n          <p style=\"font-size: 16px; line-height: 1.72; margin: 0;\">The real constraint on AI has shifted from computer chips to electricity. Data centers need enormous amounts of around-the-clock, carbon-free power, and the grid can't keep up. This quarter, Walmart signed its first-ever nuclear power agreement, and the Department of Energy committed billions to new reactors — clear signals of a structural power shortage. Many data centers have the chips they need to function, yet aren't able to plug them in due to the energy bottleneck.<\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div style=\"max-width:820px; margin:10px auto 0; padding:0 24px;\"><div style=\"border-top:1px solid #E4DDcc; padding-top:10px; font-size:10.5px; letter-spacing:0.04em; color:#A79E8C; font-style:italic; font-family:Georgia,serif;\">Paradiem, LLC is a registered investment advisor.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SECTION 3 — DIVIDEND ============ -->\n  <section id=\"s3\" data-screen-label=\"3 · Dividend Portfolio\" style=\"max-width: 820px; margin: 0 auto; padding: 58px 24px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; cursor: pointer;\" data-target=\"s3body\" sc-camel-on-click=\"{{ toggleSection }}\">\n      <span style=\"font-family: Georgia, serif; font-size: 15px; color: #C9A84C; font-style: italic;\">03<\u002Fspan>\n      <h2 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 32px; margin: 0; color: #171738; flex: 1;\">Dividend Portfolio Changes<\u002Fh2>\n      <span data-chev=\"\" style=\"color: #C9A84C; font-size: 15px; user-select: none;\">▾<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"s3body\">\n      <p style=\"font-size: 16.5px; line-height: 1.72; margin: 20px 0 6px; color: #3a3527;\">The dividend portfolio remains at <strong style=\"color: rgb(23, 23, 56);\">25 holdings<\u002Fstrong>. We exited three positions and added three, rotating out of commodity-cycle energy and rate-sensitive names, as the 30-Year Treasury recently hit its highest level since 2007, and we moved into durable data, power, and income businesses.<\u002Fp>\n\n      <!-- EXITS -->\n      <div style=\"display: flex; align-items: center; gap: 12px; margin: 40px 0 18px;\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #A8332F;\">Exits · Sold<\u002Fspan>\n        <span style=\"flex: 1; height: 1px; background: #E4DDcc;\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 16px;\">\n        <!-- Valero -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Valero<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">VLO<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Oil Refining<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">We sold Valero into strength, near an all-time high. Refining margins — the gap between crude oil and the gasoline and diesel refiners produce — reached extreme levels during the war and are historically prone to normalizing. Consensus expects Valero's earnings to decline meaningfully next year as those margins revert. Beyond the timing, Valero also carried a low overall quality score on our screening framework. Selling at a cyclical peak — while the price was high — the idea here is to harvest a substantial gain rather than wait for the margin to compress.<\u002Fp>\n        <\u002Fdiv>\n        <!-- Devon -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Devon Energy<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">DVN<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Oil &amp; Gas Production<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">Devon is trades as though it is a bet on the price of crude oil — when oil spikes it rises, and when oil round-trips it gives those gains back. It came to us through the Coterra merger, and over multiple oil cycles it has produced little net gain while swinging sharply. For an income-focused portfolio, a holding with no reliable compounding and a variable dividend wasn't the right fit.<\u002Fp>\n        <\u002Fdiv>\n        <!-- Black Hills -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Black Hills<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">BKH<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Regulated Utility<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">A rate-sensitive regulated utility facing headwinds in a higher-for-longer interest-rate environment, with a pending merger that added uncertainty. We redeployed into power exposure with a stronger growth profile.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ADDITIONS -->\n      <div style=\"display: flex; align-items: center; gap: 12px; margin: 40px 0 18px;\">\n        <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #4A7C59;\">Additions · Bought<\u002Fspan>\n        <span style=\"flex: 1; height: 1px; background: #E4DDcc;\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; gap: 16px;\">\n        <!-- Constellation -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Constellation Energy<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">CEG<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Nuclear Power<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">Constellation operates the largest fleet of nuclear power plants in America — up-and-running reactors generating electricity today, not a construction project. Nuclear is the only source that is both carbon-free and available 24/7, making it exactly what AI data centers need. As technology companies compete for round-the-clock clean power, Constellation owns the scarce asset and is signing long-term contracts (such as Walmart's first nuclear agreement) that lock in that demand for years.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Yield ~0.6%<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Utilities<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Owns the reactors powering the AI boom<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Fwd P/E ~20x<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- S&P Global -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">S&amp;P Global<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">SPGI<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Financial Data &amp; Ratings<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">S&amp;P Global is the scorekeeper of the financial system. It's half of the credit-ratings duopoly — companies must have their debt rated to borrow — and it owns the S&amp;P 500 and other indexes that trillions of investment dollars are benchmarked against. Everyone in finance pays it a toll, in good markets and bad. The market feared AI would erode its data business; we believe authoritative, trusted data becomes more valuable as AI spreads. We bought it close to the cheapest valuation in its public history.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Yield ~0.8%<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Financials<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">A toll on the entire financial system<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Fwd P/E ~21x<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- NatWest -->\n        <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n            <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">NatWest<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">NWG<\u002Fspan>\n            <span style=\"flex: 1;\"><\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">UK Bank · Income Anchor<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">NatWest is one of the United Kingdom's largest retail and commercial banks — well-run, profitable, and recently raising its own guidance. One role it plays in the portfolio is income: it pays a high dividend, trades cheaply, and adds exposure to a healthy non-US bank we didn't previously own. Once government-owned after the 2008 crisis, the UK Treasury fully exited its stake in 2025, and the bank now earns a strong return on equity.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Yield ~6.9% (fwd)<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Financials<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">The income anchor — a cheap, profitable UK bank<\u002Fspan>\n            <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Return on tangible equity 17%+<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n      <div style=\"max-width:820px; margin:10px auto 0; padding:0 24px;\"><div style=\"border-top:1px solid #E4DDcc; padding-top:10px; font-size:10.5px; letter-spacing:0.04em; color:#A79E8C; font-style:italic; font-family:Georgia,serif;\">Paradiem, LLC is a registered investment advisor.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SECTION 4 — GROWTH ============ -->\n  <section id=\"s4\" data-screen-label=\"4 · Growth Portfolio\" style=\"background: #FAF7F2; border-top: 1px solid #E4DDcc; border-bottom: 1px solid #E4DDcc; margin-top: 40px;\">\n    <div style=\"max-width: 820px; margin: 0 auto; padding: 56px 24px 24px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; cursor: pointer;\" data-target=\"s4body\" sc-camel-on-click=\"{{ toggleSection }}\">\n        <span style=\"font-family: Georgia, serif; font-size: 15px; color: #C9A84C; font-style: italic;\">04<\u002Fspan>\n        <h2 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 32px; margin: 0; color: #171738; flex: 1;\">Growth Portfolio Changes<\u002Fh2>\n        <span data-chev=\"\" style=\"color: #C9A84C; font-size: 15px; user-select: none;\">▾<\u002Fspan>\n      <\u002Fdiv>\n      <div id=\"s4body\">\n        <p style=\"font-size: 16.5px; line-height: 1.72; margin: 20px 0 6px; color: #3a3527;\">The growth portfolio remains at <strong style=\"color:#171738;\">25 holdings<\u002Fstrong>. We exited two weaker positions (plus a third that was cashed out in a merger) and added three, concentrating on quality software, financial technology, and a well-priced market leader.<\u002Fp>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin: 40px 0 18px;\">\n          <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #A8332F;\">Exits · Sold<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #E4DDcc;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 16px;\">\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Coinbase<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">COIN<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Crypto Exchange<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">Deteriorating fundamentals and one of the weakest quality profiles in the portfolio. We consolidated our financial-technology exposure into a stronger single holding.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Grupo Supervielle<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">SUPV<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Argentine Bank<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">The lowest-quality holding in the portfolio on our screening framework, in a volatile market. We exited to raise the overall quality of the sleeve.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #A8332F; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Clearwater Analytics<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A8332F;\">CWAN<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Software · Merger Cash-Out<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 0; color: #3a3527;\">Cashed out via merger — an involuntary exit as the company was acquired.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; margin: 40px 0 18px;\">\n          <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: #4A7C59;\">Additions · Bought<\u002Fspan>\n          <span style=\"flex: 1; height: 1px; background: #E4DDcc;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 16px;\">\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">ServiceNow<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">NOW<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Enterprise Software<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">ServiceNow is the software large companies use to run their internal operations — IT, HR, and workflows — the digital plumbing that keeps a big organization running day to day, and difficult to rip out once installed. Investors feared AI \"agents\" would replace this kind of software and cut the stock in half; in reality ServiceNow is selling the AI tools and still growing about 20% a year. We bought a dominant franchise at close to its cheapest valuation as a public company.<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Technology<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Growth ~20%/yr<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">The operating system for large enterprises, on sale<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Highest-conviction buy<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">SoFi Technologies<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">SOFI<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">Digital Bank<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">SoFi is a fast-growing, app-based bank offering loans, saving, investing, and payments with no physical branches, aimed at younger customers who do everything from their phones. Revenue is growing over 30% as it wins that demographic. This is our single consolidated bet on digital finance — we exited Coinbase to concentrate here — sized deliberately given consumer-credit risk later this year.<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Financials<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Revenue growth 30%+<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">The digital-first bank for the phone generation<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border: 1px solid #Eadfd0; border-left: 4px solid #4A7C59; padding: 22px 24px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px;\">\n              <span style=\"font-family: Georgia, serif; font-size: 20px; color: #171738;\">Full Truck Alliance<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #4A7C59;\">YMM<\u002Fspan>\n              <span style=\"flex: 1;\"><\u002Fspan>\n              <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8B7355;\">China Freight Platform<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 15.5px; line-height: 1.7; margin: 12px 0 16px; color: #3a3527;\">Full Truck Alliance runs the dominant freight-matching app in China — think \"Uber for trucking\" — connecting drivers with cargo and taking a fee on each load. It's the clear market leader, holds a large cash position, recently began paying a dividend, and It's inexpensive based on current valuation.<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Sector: Industrials / Transport<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">Attractive valuation<\u002Fspan>\n              <span style=\"font-size: 11.5px; font-weight: 600; color: #4A7C59; border: 1px solid #cfe0d4; background: #f4f8f4; padding: 5px 10px;\">The dominant freight app of China's trucking industry<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div style=\"max-width:820px; margin:10px auto 0; padding:0 24px;\"><div style=\"border-top:1px solid #E4DDcc; padding-top:10px; font-size:10.5px; letter-spacing:0.04em; color:#A79E8C; font-style:italic; font-family:Georgia,serif;\">Paradiem, LLC is a registered investment advisor.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ SECTION 5 — TRIMS ============ -->\n  <section id=\"s5\" data-screen-label=\"5 · Valuation Discipline\" style=\"max-width: 820px; margin: 0 auto; padding: 58px 24px 20px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 16px; cursor: pointer;\" data-target=\"s5body\" sc-camel-on-click=\"{{ toggleSection }}\">\n      <span style=\"font-family: Georgia, serif; font-size: 15px; color: #C9A84C; font-style: italic;\">05<\u002Fspan>\n      <h2 style=\"font-family: Georgia, serif; font-weight: 400; font-size: 32px; margin: 0; color: #171738; flex: 1;\">Valuation Discipline<\u002Fh2>\n      <span data-chev=\"\" style=\"color: #C9A84C; font-size: 15px; user-select: none;\">▾<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"s5body\" style=\"margin-top: 22px;\">\n      <p style=\"font-size: 17px; line-height: 1.75; margin: 0;\">Discipline cuts both ways. The same framework that says quality software is cheap says a few of our winners had grown expensive. We trimmed the following — not because they're poor businesses, but because their valuations had run well ahead of their earnings. Those trims helped fund the additions above.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px;\">\n        <span style=\"font-family: Georgia, serif; font-size: 15px; color: #171738; border: 1px solid #C9A84C; background: #FAF7F2; padding: 9px 18px;\">AMD <span style=\"color:#B8732D; font-size:12px; font-family:Calibri,Arial,sans-serif; font-weight:600;\">Trim<\u002Fspan><\u002Fspan>\n        <span style=\"font-family: Georgia, serif; font-size: 15px; color: #171738; border: 1px solid #C9A84C; background: #FAF7F2; padding: 9px 18px;\">Caterpillar <span style=\"color:#B8732D; font-size:12px; font-family:Calibri,Arial,sans-serif; font-weight:600;\">Trim<\u002Fspan><\u002Fspan>\n        <span style=\"font-family: Georgia, serif; font-size: 15px; color: #171738; border: 1px solid #C9A84C; background: #FAF7F2; padding: 9px 18px;\">Lam Research <span style=\"color:#B8732D; font-size:12px; font-family:Calibri,Arial,sans-serif; font-weight:600;\">Trim<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n      <div style=\"max-width:820px; margin:10px auto 0; padding:0 24px;\"><div me(() => window.print());\n  };\n\n  navGo = (e) => {\n    // Ensure the target section body is expanded before the anchor jump\n    const href = e.currentTarget.getAttribute('href') || '';\n    const id = href.replace('#', '');\n    const sec = document.getElementById(id);\n    if (sec) {\n      const body = sec.querySelector('[id$=\"body\"]');\n      if (body && body.style.display === 'none') {\n        body.style.display = '';\n        const chev = sec.querySelector('[data-chev]');\n        if (chev) chev.style.transform = '';\n      }\n    }\n  };\n\n  toggleSection = (e) => {\n    const id = e.currentTarget.getAttribute('data-target');\n    const el = document.getElementById(id);\n    if (!el) return;\n    const hidden = el.style.display === 'none';\n    el.style.display = hidden ? '' : 'none';\n    const chev = e.currentTarget.querySelector('[data-chev]');\n    if (chev) chev.style.transform = hidden ? '' : 'rotate(-90deg)';\n  };\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
